# Базовая конфигурация. Все числа — рабочие ориентиры этапа 1,
# их предстоит уточнить по первым замерам и позже подбирать автонастройкой.

seed = 1

[world]
width = 256
height = 256
# Верхний предел числа особей. Память под геномы = capacity * весов * 4 байта,
# и это главная статья расхода: CLI печатает её при старте.
capacity = 12288
init_agents = 2000
# Полная масса мира на клетку. Неизменна весь прогон.
# Она же задаёт плотность населения: при 4.0 выходит 2.3% занятых клеток,
# и охота в таком мире остаётся 1% рациона на всех сидах. При 16.0 — около 6%,
# и хищничество закрепляется.
mass_per_cell = 16.0
init_plant_frac = 0.35

[brain]
# 3 — это окно 7x7. Обзор 3x3 в исследованиях работал почти как слепота,
# 9x9 не давал выигрыша над 7x7.
vision_radius = 3
# В обзоре устойчивее всего была двухслойная сеть на 64 нейрона.
# 32 — компромисс по памяти для первых прогонов.
hidden = [32, 32]
# Возвращать ли выходы последнего скрытого слоя на вход следующего шага.
# Это даёт особи память: без неё она каждый раз решает заново,
# зная только то, что видит сейчас.
#
# Наводку память не улучшает (проверено на восьми сидах), но заметно меняет
# экологию: жизнь короче на четверть, поколения сменяются быстрее, мяса
# в рационе больше. Стоит 10% скорости и 13% генома.
recurrent = true

[agent]
birth_energy = 40.0
max_energy = 120.0
death_energy = 1.0
metabolism = 0.35
move_cost = 0.15
eat_rate = 6.0
# Урон подобран так, чтобы попадание почти всегда было смертельным:
# у Bejjani около 75% атак зрячих особей были смертельными.
attack_damage = 60.0
# Цена удара, её же платит промах по пустой клетке. Это единственное,
# что заставляет целиться. При 0.8 бьют вслепую, при 3.0 охота гаснет совсем.
attack_cost = 1.5
# Доля урона, достающаяся атакующему сразу как укус; остальное падает падалью
# и достаётся кому угодно. При 0.0 награда отстоит от удара на ход,
# и отбор эту связь не находит: охота не возникает вовсе.
attack_yield = 0.8
repro_threshold = 80.0
repro_share = 0.4
repro_overhead = 0.08
# Старение: гарантирует смену поколений даже в сытом мире.
age_cost_rate = 0.0006
# Рабочий диапазон из обзора — примерно 0.006..0.08; при 0.003 и 0.3 популяции вымирали.
mutation_sigma = 0.03
weight_clamp = 6.0

[resources]
growth_rate = 0.12
plant_capacity = 8.0
# Без затравки выеденная дочиста клетка не восстановится.
plant_seed = 0.02
carrion_decay = 0.04
nutrient_diffusion = 0.08

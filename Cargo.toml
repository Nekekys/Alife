[workspace]
resolver = "2"
members = ["crates/alife-core", "crates/alife-cli", "crates/alife-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
